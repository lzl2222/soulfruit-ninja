<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>薪火斩 · 不死之夜切果轮回</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 fill=%27%2305070d%27/%3E%3Cpath d=%27M50 12C60 32 78 40 74 62C72 78 60 88 50 88C38 88 26 78 26 62C26 46 40 38 42 24C46 28 48 20 50 12Z%27 fill=%27%23ff9a3c%27/%3E%3C/svg%3E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--ember:#ff9a3c;--gold:#e8c872;--bone:#e2dac4;--blood:#b3201f;
 --serif:"Songti SC","STSong","Noto Serif SC","Noto Serif CJK SC","Source Han Serif SC","SimSun","Songti TC",serif;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#05070d;overscroll-behavior:none;font-family:var(--serif);color:var(--bone);
 user-select:none;-webkit-user-select:none;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#cam{position:fixed;right:10px;bottom:calc(10px + var(--sb));width:78px;height:104px;object-fit:cover;transform:scaleX(-1);border-radius:10px;
 border:1px solid rgba(232,200,114,.5);opacity:0;pointer-events:none;background:#000;transition:opacity .4s;z-index:3;filter:brightness(.8) contrast(1.1)}
#cam.on{opacity:.55}
button{font-family:var(--serif);color:var(--bone);touch-action:manipulation}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;display:none;z-index:2}
#hud.show{display:block}
#hud .b{position:absolute}
#topL{left:12px;top:calc(10px + var(--st))}
#hp{display:flex;gap:5px;height:18px;align-items:center}
.pip{width:15px;height:19px;background:radial-gradient(ellipse at 50% 70%,#ffd27a,#ff7a1c 55%,#a3200a);clip-path:path('M7.5 0C9 5 14 7 13.5 12C13 16.5 10 19 7.5 19C5 19 2 16.5 1.5 12C1.5 8 5 6 5.5 3C6.5 4 7 2 7.5 0Z');filter:drop-shadow(0 0 4px #ff8a2a)}
.pip.lost{background:#2a2430;filter:none;opacity:.7}
.pip.shield{background:radial-gradient(ellipse at 50% 70%,#e8f4ff,#7fb8ff 55%,#2b5fa8);filter:drop-shadow(0 0 4px #7fb8ff)}
#stamW{margin-top:7px;width:150px;height:7px;background:rgba(0,0,0,.55);border:1px solid rgba(232,200,114,.45);border-radius:4px;overflow:hidden}
#stam{height:100%;width:100%;background:linear-gradient(90deg,#4f8f3a,#c8e060);transition:width .08s}
#stamW.exh #stam{background:linear-gradient(90deg,#8a2a1a,#d05a2a);animation:blink .35s infinite alternate}
#topR{right:12px;top:calc(8px + var(--st));text-align:right}
#souls{font-size:22px;color:var(--gold);text-shadow:0 0 8px rgba(255,170,60,.6),0 2px 3px #000;letter-spacing:1px;line-height:1.1}
#souls small{font-size:12px;opacity:.8;margin-right:4px}
#topBtns{margin-top:5px;display:flex;gap:6px;justify-content:flex-end}
.ib{pointer-events:auto;width:34px;height:30px;border-radius:6px;border:1px solid rgba(232,200,114,.45);background:rgba(8,10,16,.65);font-size:15px;line-height:1;padding:0;color:var(--gold)}
#floorLine{left:0;right:0;top:calc(56px + var(--st));text-align:center;font-size:13px;letter-spacing:3px;color:rgba(226,218,196,.75);text-shadow:0 1px 3px #000}
#progW{left:50%;transform:translateX(-50%);top:calc(76px + var(--st));width:56%;height:5px;background:rgba(0,0,0,.55);border:1px solid rgba(232,200,114,.3);border-radius:3px;overflow:hidden}
#prog{height:100%;width:0;background:linear-gradient(90deg,#a85a1a,#ffcf6a);transition:width .2s}
#progT{left:0;right:0;top:calc(84px + var(--st));text-align:center;font-size:11px;opacity:.6;letter-spacing:1px}
#bossW{left:6%;right:6%;top:calc(92px + var(--st));display:none;text-align:center}
#bossN{font-size:15px;letter-spacing:4px;color:#e8d9b0;text-shadow:0 0 8px rgba(255,80,40,.7),0 2px 3px #000;margin-bottom:3px}
#bossBar{height:9px;background:rgba(0,0,0,.65);border:1px solid rgba(232,200,114,.55);overflow:hidden;position:relative}
#bossHp{height:100%;width:100%;background:linear-gradient(90deg,#6e0f12,#c2262a 60%,#ff6a4a);transition:width .12s}
#bossGhost{position:absolute;left:0;top:0;height:100%;width:100%;background:rgba(255,230,180,.5);transition:width .8s .25s}
#bossHp{position:relative;z-index:1}
#combo{left:0;right:0;bottom:calc(112px + var(--sb));text-align:center;font-size:26px;font-weight:800;letter-spacing:3px;color:#ffd890;
 text-shadow:0 0 12px rgba(255,150,40,.9),0 2px 4px #000;min-height:34px;transition:transform .08s}
#combo.pop{transform:scale(1.25)}
#flaskBtn{pointer-events:auto;left:12px;bottom:calc(12px + var(--sb));width:62px;height:74px;border-radius:12px;border:1px solid rgba(232,200,114,.55);
 background:rgba(8,10,16,.7);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0}
#flaskBtn svg{width:30px;height:38px;filter:drop-shadow(0 0 5px rgba(255,150,40,.8))}
#flaskBtn.dis{opacity:.4}
#flaskBtn.go{animation:glow 1s infinite alternate}
#flaskN{font-size:15px;color:var(--gold);margin-top:1px}
#flaskCap{font-size:10px;opacity:.7;letter-spacing:1px}
#relicBar{left:84px;right:98px;bottom:calc(16px + var(--sb));display:flex;flex-wrap:wrap;gap:4px;justify-content:center;align-content:flex-end}
.rg{width:22px;height:22px;border-radius:50%;border:1px solid var(--gold);background:rgba(8,10,16,.75);font-size:12px;line-height:20px;text-align:center;color:var(--gold)}
.rg.r1{border-color:#6fb4ff;color:#9fd0ff}.rg.r2{border-color:#ffb43c;color:#ffd27a;box-shadow:0 0 6px rgba(255,170,60,.8)}
#pill{left:50%;transform:translateX(-50%);bottom:calc(62px + var(--sb));max-width:84%;text-align:center;font-size:12.5px;line-height:1.5;padding:5px 12px;
 border-radius:14px;background:rgba(0,0,0,.6);border:1px solid rgba(232,200,114,.3);display:none}
#curseTag{left:12px;top:calc(54px + var(--st));font-size:11px;color:#c98aff;letter-spacing:1px;display:none}

/* ---------- banner ---------- */
#banner{position:fixed;left:0;right:0;top:34%;text-align:center;pointer-events:none;z-index:6;opacity:0}
#banner .t{font-size:44px;font-weight:700;letter-spacing:14px;padding-left:14px;text-shadow:0 0 22px currentColor,0 3px 6px #000}
#banner .s{margin-top:10px;font-size:15px;letter-spacing:5px;opacity:.85;text-shadow:0 2px 4px #000}
#banner .line{height:1px;margin:12px auto 0;width:0;background:linear-gradient(90deg,transparent,currentColor,transparent)}
#banner.show{animation:bn var(--d,2.4s) ease-out forwards}
#banner.show .line{animation:ln var(--d,2.4s) ease-out forwards}
#banner.red{color:#c4201f}#banner.gold{color:#e8c872}#banner.boss{color:#e9d9b4}#banner.blue{color:#9fd0ff}
#banner.boss .t{font-size:34px;letter-spacing:8px}
@keyframes bn{0%{opacity:0;transform:scale(1.18)}12%{opacity:1;transform:scale(1)}78%{opacity:1}100%{opacity:0;transform:scale(.99)}}
@keyframes ln{0%{width:0}25%{width:78%}100%{width:90%}}
@keyframes blink{from{opacity:.55}to{opacity:1}}
@keyframes glow{from{box-shadow:0 0 4px rgba(255,160,60,.4)}to{box-shadow:0 0 16px rgba(255,160,60,.95)}}

/* ---------- overlays / panels ---------- */
.ov{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:flex-start;padding:calc(18px + var(--st)) 18px calc(18px + var(--sb));
 text-align:center;z-index:10;overflow-y:auto;touch-action:pan-y;background:radial-gradient(ellipse at 50% 40%,rgba(10,12,22,.55),rgba(2,3,7,.9))}
.ov.show{display:flex}
.ov>:first-child{margin-top:auto}.ov>:last-child{margin-bottom:auto}
.ov.solid{background:radial-gradient(ellipse at 50% 30%,rgba(14,16,28,.8),rgba(2,3,7,.93))}
#menu{background:linear-gradient(180deg,rgba(2,3,8,.15) 0%,rgba(2,3,8,.45) 45%,rgba(2,3,8,.72) 100%)}
h1{margin:0;font-size:78px;font-weight:900;letter-spacing:12px;padding-left:12px;line-height:1.05;color:#f4d9a0;
 background:linear-gradient(180deg,#fff3cf 0%,#ffbe5a 45%,#c4521a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
 filter:drop-shadow(0 0 14px rgba(255,120,30,.55)) drop-shadow(0 3px 4px #000)}
.sub{margin:6px 0 4px;font-size:14px;letter-spacing:6px;opacity:.8;padding-left:6px}
.orn{width:200px;height:12px;margin:10px auto;opacity:.8;background:linear-gradient(90deg,transparent,var(--gold),transparent) center/100% 1px no-repeat}
.orn:after{content:"";display:block;width:8px;height:8px;background:var(--gold);transform:rotate(45deg) translateY(-2px);margin:-4px auto 0}
.btn{display:block;width:250px;max-width:82vw;margin:7px auto;padding:13px 10px;border:1px solid rgba(232,200,114,.7);border-radius:3px;font-size:19px;letter-spacing:6px;
 padding-left:16px;color:var(--bone);background:linear-gradient(180deg,rgba(60,38,18,.8),rgba(22,14,10,.85));box-shadow:0 0 14px rgba(255,140,40,.2),inset 0 0 12px rgba(255,160,60,.08);position:relative}
.btn:active{transform:scale(.97);background:linear-gradient(180deg,rgba(100,60,24,.9),rgba(40,22,12,.9))}
.btn.alt{font-size:15px;letter-spacing:3px;padding:11px 10px;background:rgba(14,16,26,.7);border-color:rgba(226,218,196,.4);box-shadow:none}
.btn.big{border-color:#ffcf6a;background:linear-gradient(180deg,rgba(120,64,20,.9),rgba(50,24,10,.92));box-shadow:0 0 22px rgba(255,140,40,.45)}
.btn.sm{width:auto;display:inline-block;font-size:13px;letter-spacing:2px;padding:8px 16px;margin:5px 4px}
.btn[disabled],.btn.dis{opacity:.45}
.btn .tag{position:absolute;right:8px;top:-8px;font-size:10px;letter-spacing:1px;padding:1px 6px;background:#7a1c1c;border:1px solid #d86;color:#fdd;border-radius:2px}
#menuBest{font-size:12px;opacity:.7;line-height:1.7;margin:10px 0 8px;letter-spacing:1px}
#startMsg,#ctlMsg{min-height:20px;margin-top:8px;font-size:13px;color:#ffd9a0;max-width:330px;line-height:1.5}
.small{font-size:11.5px;opacity:.6;margin-top:10px;max-width:320px;line-height:1.6}
#pTitle{font-size:26px;letter-spacing:8px;padding-left:8px;color:var(--gold);text-shadow:0 0 12px rgba(255,150,40,.5)}
#pSub{font-size:13px;opacity:.75;margin:6px 0 12px;max-width:340px;line-height:1.6;letter-spacing:1px}
#pCards{display:flex;flex-direction:column;gap:9px;width:100%;max-width:360px}
.card{display:flex;align-items:center;gap:12px;text-align:left;width:100%;padding:11px 12px;border-radius:4px;border:1px solid rgba(226,218,196,.35);
 background:linear-gradient(90deg,rgba(24,26,40,.92),rgba(12,14,24,.92));position:relative;font-size:14px}
.card:active{transform:scale(.98)}
.card.r1{border-color:#5ea6f0;box-shadow:0 0 12px rgba(80,150,240,.3)}
.card.r2{border-color:#ffb43c;box-shadow:0 0 16px rgba(255,170,60,.45);background:linear-gradient(90deg,rgba(56,34,12,.92),rgba(20,14,12,.92))}
.card.dis{opacity:.4}
.card .gl{flex:none;width:46px;height:46px;border-radius:50%;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--gold);
 background:radial-gradient(circle,rgba(255,160,60,.18),rgba(0,0,0,.3));text-shadow:0 0 8px rgba(255,150,40,.8)}
.card.r1 .gl{border-color:#6fb4ff;color:#a8d4ff}.card.r2 .gl{border-color:#ffb43c;color:#ffe0a0}
.card .nm{font-size:17px;letter-spacing:3px;color:#f0e6c8;margin-bottom:3px}
.card .ds{font-size:12.5px;line-height:1.5;opacity:.8}
.card .ds b{color:#ffcf6a;font-weight:600}
.card .rk{position:absolute;right:8px;top:6px;font-size:10px;letter-spacing:2px;opacity:.7}
.card .pr{position:absolute;right:10px;bottom:7px;font-size:13px;color:var(--gold)}
.card.sold{opacity:.3;pointer-events:none}
#pFoot{margin-top:12px}
#ngRow{font-size:13px;margin:4px 0}
.rank{font-size:15px;letter-spacing:5px;color:var(--gold);margin:6px 0}
#overTitle{font-size:54px;font-weight:700;letter-spacing:16px;padding-left:16px;color:#c4201f;text-shadow:0 0 24px rgba(200,30,30,.8),0 3px 6px #000;opacity:0}
#overTitle.gold{color:var(--gold);text-shadow:0 0 24px rgba(255,170,60,.8),0 3px 6px #000}
#overTitle.in{animation:fadein 2s ease-out forwards}
@keyframes fadein{from{opacity:0;letter-spacing:2px}to{opacity:1;letter-spacing:16px}}
#overInfo{font-size:14.5px;line-height:1.9;margin:6px 0 12px;letter-spacing:1px}
#overInfo b{color:var(--gold);font-weight:600}
#finalScore{font-size:44px;color:var(--gold);line-height:1.1;text-shadow:0 0 12px rgba(255,170,60,.6)}
#finalLbl{font-size:12px;opacity:.7;letter-spacing:4px;margin-top:2px}
#newRec{color:#ff9a6a;min-height:22px;font-size:15px;letter-spacing:3px}
.row{display:flex;align-items:center;gap:10px;width:100%;max-width:360px;padding:9px 10px;margin-bottom:7px;border:1px solid rgba(226,218,196,.25);background:rgba(14,16,26,.8);border-radius:4px;text-align:left}
.row .gl{flex:none;width:38px;height:38px;border-radius:50%;border:1.5px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:19px;color:var(--gold)}
.row .tx{flex:1;font-size:12px;line-height:1.5;opacity:.85}.row .tx b{font-size:15px;color:#f0e6c8;letter-spacing:2px;opacity:1;font-weight:600}
.row .bt{flex:none;min-width:70px;padding:7px 6px;font-size:13px;border:1px solid var(--gold);background:rgba(60,38,18,.8);border-radius:3px;letter-spacing:1px}
.row .bt.dis{opacity:.4}.row .bt.on{background:rgba(70,100,50,.7);border-color:#9c6}
.sect{font-size:13px;letter-spacing:6px;color:var(--gold);margin:12px 0 8px;opacity:.9}
#rotate{position:fixed;left:0;right:0;top:0;z-index:20;display:none;padding:6px;text-align:center;font-size:13px;background:rgba(150,30,30,.92)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + var(--sb));z-index:30;padding:8px 16px;background:rgba(0,0,0,.8);border:1px solid var(--gold);border-radius:4px;font-size:13px;letter-spacing:2px;color:var(--gold);display:none;max-width:86%;text-align:center}
@media (orientation:landscape) and (max-height:520px){#rotate{display:block}h1{font-size:46px}}
@media (max-height:700px){h1{font-size:60px}.btn{padding:10px}#bossW{top:calc(86px + var(--st))}}
</style>
</head>
<body>
<video id="cam" playsinline webkit-playsinline muted autoplay></video>
<canvas id="c"></canvas>

<div id="hud">
  <div class="b" id="topL"><div id="hp"></div><div id="stamW"><div id="stam"></div></div></div>
  <div class="b" id="topR"><div id="souls"><small>魂</small><span id="soulsN">0</span></div>
    <div id="topBtns"><button class="ib" id="muteBtn" type="button">音</button><button class="ib" id="pauseBtn" type="button">Ⅱ</button></div></div>
  <div class="b" id="floorLine"></div>
  <div class="b" id="curseTag"></div>
  <div class="b" id="progW"><div id="prog"></div></div>
  <div class="b" id="progT"></div>
  <div class="b" id="bossW"><div id="bossN"></div><div id="bossBar"><div id="bossGhost"></div><div id="bossHp"></div></div></div>
  <div class="b" id="combo"></div>
  <button class="b" id="flaskBtn" type="button">
    <svg viewBox="0 0 30 38"><path d="M11 1h8v3h-2v7l8 15c2 4-1 10-6 10H11c-5 0-8-6-6-10l8-15V4h-2z" fill="rgba(20,12,8,.8)" stroke="#e8c872" stroke-width="1.5"/><path d="M8 24l5-9h4l5 9c1 3-1 7-5 7h-4c-4 0-6-4-5-7z" fill="#ff8a2a"/></svg>
    <span id="flaskN">3</span></button>
  <div class="b" id="relicBar"></div>
  <div class="b" id="pill"></div>
</div>
<div id="banner"><div class="t" id="bT"></div><div class="line"></div><div class="s" id="bS"></div></div>
<div id="toast"></div>
<div id="rotate">请把手机竖过来玩(竖屏体验最佳)</div>

<!-- 主菜单 -->
<div class="ov show" id="menu">
  <h1>薪火斩</h1>
  <div class="sub">不死之夜 · 切果轮回</div>
  <div class="orn"></div>
  <div id="menuBest"></div>
  <button class="btn big" id="mRun" type="button">开始轮回</button>
  <button class="btn" id="mDaily" type="button">每日挑战</button>
  <button class="btn" id="mPractice" type="button">练习模式</button>
  <button class="btn" id="mCamp" type="button">篝火营地</button>
  <button class="btn alt" id="mHow" type="button">玩法说明</button>
  <div class="small">黑夜里只有光能看清一切。用刀光点亮水果,在不死的夜里一层层向下猎杀首领。</div>
</div>

<!-- 操控方式 -->
<div class="ov solid" id="ctl">
  <div id="pTitle2" style="font-size:24px;letter-spacing:8px;color:var(--gold)">选择操控方式</div>
  <div class="orn"></div>
  <button class="btn" id="ctlCam" type="button">摄像头隔空挥手</button>
  <div class="small" style="margin:0 0 10px">用食指指尖当刀光(需要允许摄像头,画面只在本机处理)</div>
  <button class="btn big" id="ctlTouch" type="button" style="font-size:16px;letter-spacing:2px">不用摄像头,用手指滑屏玩</button>
  <div id="ctlMsg"></div>
  <button class="btn alt sm" id="ctlBack" type="button">返回</button>
</div>

<!-- 通用面板 -->
<div class="ov solid" id="panel">
  <div id="pTitle"></div><div class="orn"></div><div id="pSub"></div>
  <div id="pCards"></div><div id="pFoot"></div>
</div>

<!-- 营地 -->
<div class="ov solid" id="camp" style="justify-content:flex-start">
  <div style="font-size:26px;letter-spacing:8px;color:var(--gold);margin-top:8px">篝火营地</div>
  <div class="sub" id="campAsh" style="margin-bottom:8px"></div>
  <div style="width:100%;display:flex;flex-direction:column;align-items:center" id="campList"></div>
  <button class="btn alt" id="campBack" type="button" style="margin-top:10px">返回</button>
</div>

<!-- 玩法 -->
<div class="ov solid" id="how">
  <div style="font-size:24px;letter-spacing:8px;color:var(--gold)">玩法说明</div><div class="orn"></div>
  <div id="howTxt" style="text-align:left;max-width:330px;font-size:13.5px;line-height:1.75;opacity:.92"></div>
  <button class="btn alt" id="howBack" type="button" style="margin-top:14px">明白了</button>
</div>

<!-- 暂停 -->
<div class="ov solid" id="pause">
  <div style="font-size:26px;letter-spacing:10px;color:var(--gold)">暂 停</div><div class="orn"></div>
  <div id="pauseInfo" style="font-size:12.5px;line-height:1.7;max-width:340px;text-align:left;margin-bottom:8px"></div>
  <button class="btn" id="pResume" type="button">继续</button>
  <button class="btn alt" id="pSound" type="button">音效:开</button>
  <button class="btn alt" id="pQuit" type="button">放弃轮回</button>
</div>

<!-- 结算 -->
<div class="ov solid" id="over">
  <div id="overTitle">你已死亡</div>
  <div class="rank" id="overRank"></div>
  <div id="finalScore">0</div><div id="finalLbl">本轮获得的魂</div>
  <div id="newRec"></div>
  <div id="overInfo"></div>
  <button class="btn big" id="againBtn" type="button">重返轮回</button>
  <button class="btn" id="campBtn2" type="button">篝火营地</button>
  <button class="btn alt" id="homeBtn" type="button">返回主菜单</button>
</div>
<script>
(function () {
'use strict';
/* ================= 基础工具 ================= */
const $ = id => document.getElementById(id);
const cam = $('cam'), cv = $('c'), ctx = cv.getContext('2d');
let W = 390, H = 844, dpr = 1;
const TAU = Math.PI * 2;

  { k: 'stam', n: '绵长呼吸', g: '息', d: '体力上限 +15,回复 +10%', max: 3, cost: [50, 100, 150] }, { k: 'soul', n: '魂之吸引', g: '魂', d: '魂获取 +10%', max: 3, cost: [60, 120, 180] },
  { k: 'gift', n: '出发的馈赠', g: '礼', d: '开局赠送遗物:1 级随机普通,2 级再加随机稀有', max: 2, cost: [100, 220] }];
const UNL = { chain: 80, vamp: 100, gold: 180, sun: 200, ashheart: 200 };
function renderCamp() {
  const box = $('campList'); box.innerHTML = ''; $('campAsh').textContent = '灰烬 ' + SAVE.ashes + (SAVE.ngMax ? ' · 最高 ' + (SAVE.ngMax + 1) + ' 周目' : '');
  const sect = t => { const d = document.createElement('div'); d.className = 'sect'; d.textContent = t; box.appendChild(d); };
  const row = (g, n, d, btn, dis, on, f) => { const r = document.createElement('div'); r.className = 'row'; r.innerHTML = '<div class="gl">' + g + '</div><div class="tx"><b>' + n + '</b><br>' + d + '</div>'; const b = document.createElement('button'); b.type = 'button'; b.className = 'bt' + (dis ? ' dis' : '') + (on ? ' on' : ''); b.textContent = btn; b.addEventListener('click', () => { if (!dis) f(); }); r.appendChild(b); box.appendChild(r); };
  sect('永久强化');
  UPG.forEach(u => { const lv = SAVE.meta[u.k], maxed = lv >= u.max, c = u.cost[lv]; row(u.g, u.n + ' ' + lv + '/' + u.max, u.d, maxed ? '已满' : c + ' 灰烬', maxed || SAVE.ashes < c, maxed, () => { SAVE.ashes -= c; SAVE.meta[u.k]++; save(); sfx('gold'); renderCamp(); }); });
  sect('遗物解锁(解锁后才会在轮回中出现)');
  RELICS.filter(r => r.lock).forEach(r => { const own = SAVE.meta.unlock[r.lock], c = UNL[r.lock]; row(r.g, r.n + ' · ' + RN[r.r], r.d, own ? '已解锁' : c + ' 灰烬', own || SAVE.ashes < c, own, () => { SAVE.ashes -= c; SAVE.meta.unlock[r.lock] = 1; save(); sfx('gold'); renderCamp(); }); });
  sect('刀光');
  for (const k in SKINS) { const s = SKINS[k], own = SAVE.meta.skinOwn[k], sel = SAVE.meta.skin === k; row('刃', s.n + '之光', own ? '已拥有' : '购买后可使用', sel ? '使用中' : own ? '装备' : s.cost + ' 灰烬', sel || (!own && SAVE.ashes < s.cost), sel, () => { if (!own) { SAVE.ashes -= s.cost; SAVE.meta.skinOwn[k] = 1; } SAVE.meta.skin = k; save(); sfx('gold'); renderCamp(); }); }
  sect('成就 ' + ACH.filter(a => SAVE.ach[a.id]).length + '/' + ACH.length);
  const al = document.createElement('div'); al.style.cssText = 'font-size:12.5px;line-height:1.8;max-width:340px;text-align:left;opacity:.9';
  al.innerHTML = ACH.map(a => '<span style="color:' + (SAVE.ach[a.id] ? '#e8c872' : '#667') + '">' + (SAVE.ach[a.id] ? '◆ ' : '◇ ') + a.n + ' —— ' + a.d + '</span>').join('<br>'); box.appendChild(al);
}

let wakeLock = null;
function requestWake() { try { if (navigator.wakeLock) navigator.wakeLock.request('screen').then(l => wakeLock = l).catch(() => {}); } catch (e) {} }
function pauseGame(on) {
  if (S.screen !== 'play' || !R || S.dying) return; if (on && (S.phase === 'panel')) return;
  S.paused = on; show('pause', on);
  if (on) {
    let h = '当前遗物(' + R.relics.length + '):<br>'; if (!R.relics.length) h += '<span style="opacity:.6">暂无</span>'; R.relics.forEach(id => { const r = RMAP[id]; h += '<b style="color:#e8c872">[' + r.g + '] ' + r.n + '</b> ' + r.d.replace(/<[^>]+>/g, '') + '<br>'; });
    SYNS.forEach(s => { if (synOn(s.a, s.b)) h += '<b style="color:#9fd0ff">共鸣「' + s.n + '」</b> ' + s.d + '<br>'; });
    h += '<br>魂 ' + R.souls + ' · 生命 ' + R.hp + '/' + R.maxHp + ' · 轮回种子 #' + R.seed; $('pauseInfo').innerHTML = h; $('pQuit').textContent = R.mode === 'practice' ? '结束练习' : '放弃轮回'; quitArm = false;
  }
}
let quitArm = false;
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(true); else if (S.screen === 'play') requestWake(); });

/* ================= 输入 ================= */
cv.addEventListener('pointerdown', e => {
  try { cv.setPointerCapture(e.pointerId); } catch (err) {} delete trails['p' + e.pointerId];
  if (S.screen === 'play') addTrailPoint('p' + e.pointerId, e.clientX, e.clientY, e.timeStamp || performance.now(), 1e9);
  else S.lantern = { x: e.clientX, y: e.clientY, t: performance.now() };
  initAudio(); e.preventDefault();
});
cv.addEventListener('pointermove', e => {
  const key = 'p' + e.pointerId; if (!trails[key] || (e.pointerType === 'mouse' && e.buttons === 0)) return;
  const evs = (e.getCoalescedEvents && e.getCoalescedEvents()) || [e]; const th = Math.max(.2 * W, 70);
  for (let i = 0; i < (evs.length || 1); i++) { const q = evs[i] || e; addTrailPoint(key, q.clientX, q.clientY, q.timeStamp || performance.now(), th); }
  e.preventDefault();
});
const endPointer = e => { const tr = trails['p' + e.pointerId]; if (tr) tr.ended = true; };
cv.addEventListener('pointerup', endPointer); cv.addEventListener('pointercancel', endPointer);
['gesturestart', 'dblclick', 'contextmenu'].forEach(n => document.addEventListener(n, e => e.preventDefault()));
document.addEventListener('touchmove', e => { if (e.target === cv) e.preventDefault(); }, { passive: false });
document.addEventListener('click', e => { const b = e.target.closest && e.target.closest('button'); if (b) { initAudio(); sfx('click'); } }, true);

/* ================= 摄像头 & MediaPipe ================= */
const MP_VERSION = '0.10.14';
const MP_BASES = ['https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@' + MP_VERSION, 'https://unpkg.com/@mediapipe/tasks-vision@' + MP_VERSION];
const MODEL_URL = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';
let handLandmarker = null, lastVideoTime = -1, lastTs = 0, detectErrors = 0;
function camErrorText(err) {
  if (!window.isSecureContext || !(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) return '当前页面不是 HTTPS 安全环境(或浏览器不支持摄像头)';
  switch (err && err.name) {
    case 'NotAllowedError': case 'SecurityError': case 'PermissionDeniedError': return '摄像头权限被拒绝(或被系统/浏览器限制)';
    case 'NotFoundError': case 'DevicesNotFoundError': case 'OverconstrainedError': return '没有找到可用的摄像头';
    case 'NotReadableError': case 'TrackStartError': return '摄像头正被其他应用占用,或无法启动';
    case 'AbortError': return '摄像头启动被中断'; case 'Timeout': return '摄像头请求超时(可能被系统弹窗挡住)';
    default: return '摄像头无法使用' + (err && err.message ? '(' + err.message + ')' : '');
  }
}
function openCamera() {
  if (S.stream && S.stream.active && cam.srcObject) return Promise.resolve();
  if (!window.isSecureContext || !(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) return Promise.reject({ name: 'InsecureContext' });
  const first = { video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }, audio: false };
  return navigator.mediaDevices.getUserMedia(first).catch(err => { if (err && (err.name === 'OverconstrainedError' || err.name === 'NotFoundError')) return navigator.mediaDevices.getUserMedia({ video: true, audio: false }); throw err; })
    .then(stream => { S.stream = stream; cam.srcObject = stream; cam.muted = true; cam.setAttribute('playsinline', ''); cam.playsInline = true; const p = cam.play(); return (p && p.then ? p : Promise.resolve()).then(() => cam.classList.add('on')); });
}
function loadHandModel() {
  if (S.handReady || S.handLoading) return; S.handLoading = true; let bi = 0;
  function tryBase() {
    const base = MP_BASES[bi];
    return import(base + '/vision_bundle.mjs').then(mod => mod.FilesetResolver.forVisionTasks(base + '/wasm').then(fileset => {
      const create = d => mod.HandLandmarker.createFromOptions(fileset, { baseOptions: { modelAssetPath: MODEL_URL, delegate: d }, runningMode: 'VIDEO', numHands: 2, minHandDetectionConfidence: .5, minHandPresenceConfidence: .5, minTrackingConfidence: .5 });
      if (/[?&]cpu\b/.test(location.search)) return create('CPU'); return create('GPU').catch(() => create('CPU'));
    })).catch(err => { if (++bi < MP_BASES.length) return tryBase(); throw err; });
  }
  tryBase().then(hl => { handLandmarker = hl; S.handReady = true; S.handLoading = false; }).catch(err => { S.handLoading = false; S.mode = 'touch'; S.fallbackReason = '手势模型加载失败(请检查网络),可继续用手指滑屏'; cam.classList.remove('on'); pill('⚠ ' + S.fallbackReason, 4000); });
}
function mapLandmark(lm) { return { x: clamp((1 - (lm.x - .08) / .84) * W, -20, W + 20), y: clamp((lm.y - .1) / .8 * H, -20, H + 20) }; }
const smooth = {};
function detectHands(now) {
  if (!handLandmarker || S.mode !== 'camera' || cam.readyState < 2 || !cam.videoWidth || S.screen !== 'play') return;
  if (cam.currentTime === lastVideoTime) return; lastVideoTime = cam.currentTime; const ts = Math.max(now, lastTs + 1); lastTs = ts; let res;
  try { res = handLandmarker.detectForVideo(cam, ts); detectErrors = 0; } catch (err) { if (++detectErrors > 8) { S.mode = 'touch'; S.fallbackReason = '手势识别出错,已切换为触屏模式'; cam.classList.remove('on'); } return; }
  const seen = {};
  if (res && res.landmarks) for (let i = 0; i < res.landmarks.length; i++) {
    const tip = res.landmarks[i][8]; if (!tip) continue; const p = mapLandmark(tip), key = 'h' + i, sm = smooth[key];
    if (sm && now - sm.t < 300) { p.x = sm.x + (p.x - sm.x) * .7; p.y = sm.y + (p.y - sm.y) * .7; } smooth[key] = { x: p.x, y: p.y, t: now }; seen[key] = 1; S.handSeenAt = now; addTrailPoint(key, p.x, p.y, now, thr(), 300);
  }
  for (const k in smooth) if (!seen[k] && now - smooth[k].t > 300) delete smooth[k];
}

$('pQuit').addEventListener('click', () => { if (!quitArm) { quitArm = true; $('pQuit').textContent = '再点一次确认'; return; } S.paused = false; show('pause', false); finishRun(false); });

/* ================= 主循环 ================= */
let lastFrame = 0, hudTick = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = lastFrame ? Math.min((now - lastFrame) / 1000, .05) : .016; lastFrame = now;
  detectHands(now);
  if (!S.paused) update(dt, now);
  render(now);
  if (S.screen === 'play' && (dirty.hud || now - hudTick > 90)) { hudTick = now; dirty.hud = false; updateHud(); updatePill(); }
}
resize(); window.addEventListener('resize', resize); window.addEventListener('orientationchange', () => setTimeout(resize, 200));
initAmbient(); setMuted(S.muted); refreshMenu();
requestAnimationFrame(frame);
window.__sf = { S: S, get R() { return R; }, get B() { return B; }, ents: ents, SAVE: SAVE, launch: launch, addTrailPoint: addTrailPoint, startFloor: startFloor, floorDone: floorDone, pendingStart: (m, o) => { S.pendingMode = m; S.pendingOpt = o || {}; S.mode = 'touch'; launchPending(); }, addRelic: addRelic, hurt: hurt, sliceEnt: sliceEnt, die: die, drinkFlask: drinkFlask, gainSouls: gainSouls, bossDefeat: bossDefeat, save: save, dirty: dirty, shopPanel: shopPanel, shrinePanel: shrinePanel, pathPanel: pathPanel, relicPanel: relicPanel, nodePanel: nodePanel, nextFloor: nextFloor };
})();
